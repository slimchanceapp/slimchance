<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#100E26" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Slim Chance" />
    <title>Slim Chance — honest odds on losing weight</title>
    <meta name="description" content="An open-source weight-loss app, free to use, for people doing it on their own: the odds you&#39;re really losing instead of the daily scale, a calorie budget learned from your own log, and a plan for the moments that undo most diets. No ads, no account needed to start." />
    <link rel="canonical" href="https://slimchance.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Slim Chance" />
    <meta property="og:title" content="Slim Chance — better odds than the name suggests" />
    <meta property="og:description" content="An open-source weight-loss app, free to use, that tells you the odds you&#39;re really losing, and learns from your own scale, so a rough food log is good enough. No ads. No account needed to start." />
    <meta property="og:url" content="https://slimchance.app/" />
    <meta property="og:image" content="https://slimchance.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/icon.svg" />
    <script src="%sveltekit.assets%/from.js"></script>
    %sveltekit.head%
    <script>
      /* Apply the saved theme and text size BEFORE first paint.
         Both were applied from an $effect, i.e. after hydration, so the app
         painted at the wrong size/colour and then jumped. A text-size setting
         that visibly snaps on every launch reads as a bug, so it goes here —
         synchronous, blocking, before the first frame. Wrapped in try/catch
         because a WebView with storage disabled must still boot. */
      try {
        /* Light or dark: what they chose, else what the phone is set to
           (2026-11-10: Daylight and Deep are a pair, so either is a home). */
        var t = localStorage.getItem('theme');
        if (t === 'light' || (!t && matchMedia('(prefers-color-scheme: light)').matches))
          document.documentElement.setAttribute('data-theme', 'light');
        var s = parseFloat(localStorage.getItem('uiScale'));
        if (s >= 1 && s <= 1.4)
          document.documentElement.style.setProperty('--ui-scale', String(s));
      } catch (e) {}
      /* The apps come from the App Store and Google Play: Chrome must not
         offer to install a copy of the website instead. */
      window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); });
    </script>
    <style>
      /* The coin, spinning on its edge: on screen from the first paint until
         the app is ready (#boot), and again when a tab takes a moment
         (CoinSpin.svelte, the same drawing). Here, so it shows before any
         script or stylesheet arrives. Transforms only: the compositor keeps
         it turning while the page underneath is busy. */
      #boot{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#100E26;transition:opacity .25s ease}
      [data-theme="light"] #boot{background:#F6F7FB}
      #boot.out{opacity:0;pointer-events:none}
      .cspin{display:block;color:#FCC419;overflow:visible}
      [data-theme="light"] .cspin{color:#B7861F}
      .cspin .cs-face,.cspin .cs-edge,.cspin .cs-floor{transform-box:fill-box;transform-origin:center}
      .cspin .cs-toss{animation:cs-toss 1.4s infinite}
      .cspin .cs-face{animation:cs-face 1.4s infinite}
      .cspin .cs-edge{animation:cs-edge 1.4s infinite}
      .cspin .cs-floor{animation:cs-floor 1.4s infinite}
      .cspin .cs-heads{animation:cs-heads 1.4s infinite steps(1,end)}
      .cspin .cs-tails{opacity:0;animation:cs-tails 1.4s infinite steps(1,end)}
      /* A toss (the owner, 2026-11-19): the coin goes up and comes down while it
         flips over its horizontal axis, heads (an S) then tails (a 10, a shade
         darker), changing side while it's edge-on, unseen. The face narrows as
         cos, the rim widens as sin: slow at the flats, quick through the edge. */
      @keyframes cs-toss{0%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.6,.35,1)}50%{transform:translateY(-12px);animation-timing-function:cubic-bezier(.65,0,.8,.4)}100%{transform:translateY(0)}}
      @keyframes cs-face{
        0%{transform:scaleY(1);animation-timing-function:cubic-bezier(.4,0,1,1)}
        25%{transform:scaleY(0);animation-timing-function:cubic-bezier(0,0,.6,1)}
        50%{transform:scaleY(-1);animation-timing-function:cubic-bezier(.4,0,1,1)}
        75%{transform:scaleY(0);animation-timing-function:cubic-bezier(0,0,.6,1)}
        100%{transform:scaleY(1)}
      }
      @keyframes cs-edge{
        0%{transform:scaleY(.2);animation-timing-function:cubic-bezier(0,0,.6,1)}
        25%{transform:scaleY(1);animation-timing-function:cubic-bezier(.4,0,1,1)}
        50%{transform:scaleY(.2);animation-timing-function:cubic-bezier(0,0,.6,1)}
        75%{transform:scaleY(1);animation-timing-function:cubic-bezier(.4,0,1,1)}
        100%{transform:scaleY(.2)}
      }
      /* The shadow shrinks and fades while the coin is up. */
      @keyframes cs-floor{0%,100%{transform:scaleX(1);opacity:.45}50%{transform:scaleX(.6);opacity:.22}}
      @keyframes cs-heads{0%{opacity:1}25%{opacity:0}75%{opacity:1}}
      @keyframes cs-tails{0%{opacity:0}25%{opacity:1}75%{opacity:0}}
      @media (prefers-reduced-motion:reduce){.cspin .cs-toss,.cspin .cs-face,.cspin .cs-edge,.cspin .cs-floor,.cspin .cs-heads,.cspin .cs-tails{animation:none}}
    </style>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="boot" role="status" aria-label="Loading"><svg class="cspin" viewBox="0 0 72 76" width="64" height="68" aria-hidden="true"><g class="cs-toss"><g class="cs-edge"><rect x="9" y="32.5" width="54" height="9" rx="4.5" fill="currentColor" opacity=".6"/><path d="M13.0 32.5v9M16.3 32.5v9M19.6 32.5v9M22.9 32.5v9M26.2 32.5v9M29.5 32.5v9M32.8 32.5v9M36.1 32.5v9M39.4 32.5v9M42.7 32.5v9M46.0 32.5v9M49.3 32.5v9M52.6 32.5v9M55.9 32.5v9M59.2 32.5v9" stroke="#000" stroke-opacity=".32" stroke-width="1.35"/></g><g class="cs-face"><circle cx="36" cy="37" r="27" fill="currentColor"/><circle cx="36" cy="37" r="22.6" fill="none" stroke="#000" stroke-opacity=".28" stroke-width="2.1"/><g class="cs-heads"><g transform="translate(36 37) scale(2.35) translate(-12 -12)"><path d="M14.25 8.1A2.6 2.6 0 1 0 12 12a2.6 2.6 0 1 1-2.25 3.9" fill="none" stroke="#000" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round"/></g></g><g class="cs-tails"><circle cx="36" cy="37" r="27" fill="#000" opacity=".14"/><g transform="translate(36 37) scale(2.35) translate(-12 -12)"><g transform="translate(0 24) scale(1 -1)"><path d="M9.3 8.5L10.7 7.4V16.6M14.4 7.4A2 4.6 0 1 1 14.4 16.6A2 4.6 0 1 1 14.4 7.4" fill="none" stroke="#000" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g></g></g></g></g><ellipse class="cs-floor" cx="36" cy="71" rx="17" ry="2.2" fill="currentColor"/></svg></div>
    <div style="display:contents">%sveltekit.body%</div>
  </body>
</html>
