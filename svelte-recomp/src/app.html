<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101826" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Slim Chance" />
    <title>Slim Chance — honest odds on losing weight</title>
    <meta name="description" content="An open-source weight-loss app, free to use, for people doing it on their own: the odds you&#39;re really losing instead of the daily scale, a calorie budget learned from your own log, and a plan for the moments that undo most diets. No ads, no account needed to start." />
    <link rel="canonical" href="https://slimchance.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Slim Chance" />
    <meta property="og:title" content="Slim Chance — better odds than the name suggests" />
    <meta property="og:description" content="An open-source weight-loss app, free to use, that tells you the odds you&#39;re really losing, and learns from your own scale, so a rough food log is good enough. No ads. No account needed to start." />
    <meta property="og:url" content="https://slimchance.app/" />
    <meta property="og:image" content="https://slimchance.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/icon.svg" />
    <script src="%sveltekit.assets%/from.js"></script>
    %sveltekit.head%
    <script>
      /* Apply the saved theme and text size BEFORE first paint.
         Both were applied from an $effect, i.e. after hydration, so the app
         painted at the wrong size/colour and then jumped. A text-size setting
         that visibly snaps on every launch reads as a bug, so it goes here —
         synchronous, blocking, before the first frame. Wrapped in try/catch
         because a WebView with storage disabled must still boot. */
      try {
        if (localStorage.getItem('theme') === 'light')
          document.documentElement.setAttribute('data-theme', 'light');
        var s = parseFloat(localStorage.getItem('uiScale'));
        if (s >= 1 && s <= 1.4)
          document.documentElement.style.setProperty('--ui-scale', String(s));
      } catch (e) {}
      /* The apps come from the App Store and Google Play: Chrome must not
         offer to install a copy of the website instead. */
      window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); });
    </script>
    <style>
      /* The coin, spinning on its edge: on screen from the first paint until
         the app is ready (#boot), and again when a tab takes a moment
         (CoinSpin.svelte, the same drawing). Here, so it shows before any
         script or stylesheet arrives. Transforms only: the compositor keeps
         it turning while the page underneath is busy. */
      #boot{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#101826;transition:opacity .25s ease}
      [data-theme="light"] #boot{background:#F1F2F4}
      #boot.out{opacity:0;pointer-events:none}
      .cspin{display:block;color:#C9A54E;overflow:visible}
      [data-theme="light"] .cspin{color:#8A6A1F}
      .cspin .cs-face,.cspin .cs-edge,.cspin .cs-floor{transform-box:fill-box;transform-origin:center}
      .cspin .cs-face{animation:cs-face 1.4s infinite}
      .cspin .cs-edge{animation:cs-edge 1.4s infinite}
      .cspin .cs-floor{animation:cs-floor 1.4s infinite}
      .cspin .cs-tails{fill:#000;opacity:0;animation:cs-tails 1.4s infinite steps(1,end)}
      /* The face narrows as cos, the rim widens as sin: slow at the flats, quick through the edge. */
      @keyframes cs-face{
        0%{transform:scaleX(1);animation-timing-function:cubic-bezier(.4,0,1,1)}
        25%{transform:scaleX(0);animation-timing-function:cubic-bezier(0,0,.6,1)}
        50%{transform:scaleX(-1);animation-timing-function:cubic-bezier(.4,0,1,1)}
        75%{transform:scaleX(0);animation-timing-function:cubic-bezier(0,0,.6,1)}
        100%{transform:scaleX(1)}
      }
      @keyframes cs-edge{
        0%{transform:scaleX(.2);animation-timing-function:cubic-bezier(0,0,.6,1)}
        25%{transform:scaleX(1);animation-timing-function:cubic-bezier(.4,0,1,1)}
        50%{transform:scaleX(.2);animation-timing-function:cubic-bezier(0,0,.6,1)}
        75%{transform:scaleX(1);animation-timing-function:cubic-bezier(.4,0,1,1)}
        100%{transform:scaleX(.2)}
      }
      @keyframes cs-floor{0%,50%,100%{transform:scaleX(1);opacity:.45}25%,75%{transform:scaleX(.4);opacity:.25}}
      /* Tails is a shade darker; it changes side while the coin is edge-on, unseen. */
      @keyframes cs-tails{0%{opacity:0}25%{opacity:.2}75%{opacity:0}}
      @media (prefers-reduced-motion:reduce){.cspin .cs-face,.cspin .cs-edge,.cspin .cs-floor,.cspin .cs-tails{animation:none}}
    </style>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="boot" role="status" aria-label="Loading"><svg class="cspin" viewBox="0 0 72 76" width="64" height="68" aria-hidden="true"><g class="cs-edge"><rect x="31.5" y="9" width="9" height="58" rx="4.5" fill="currentColor" opacity=".6"/><path d="M31.5 13.0h9M31.5 16.3h9M31.5 19.6h9M31.5 22.9h9M31.5 26.2h9M31.5 29.5h9M31.5 32.8h9M31.5 36.1h9M31.5 39.4h9M31.5 42.7h9M31.5 46.0h9M31.5 49.3h9M31.5 52.6h9M31.5 55.9h9M31.5 59.2h9M31.5 62.5h9" stroke="#000" stroke-opacity=".32" stroke-width="1.35"/></g><g class="cs-face"><ellipse cx="36" cy="38" rx="26" ry="29" fill="currentColor"/><ellipse cx="36" cy="38" rx="21.8" ry="24.8" fill="none" stroke="#000" stroke-opacity=".28" stroke-width="2.1"/><ellipse class="cs-tails" cx="36" cy="38" rx="26" ry="29"/></g><ellipse class="cs-floor" cx="36" cy="70.5" rx="17" ry="2.2" fill="currentColor"/></svg></div>
    <div style="display:contents">%sveltekit.body%</div>
  </body>
</html>
