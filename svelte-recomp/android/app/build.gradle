apply plugin: 'com.android.application'

android {
    namespace "com.toxicminds.recompos"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.toxicminds.recompos"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 18
        versionName "2.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Every APK is signed with ONE stable key so installs are true in-place
    // updates (no uninstall, data + login preserved). Before it, CI regenerated
    // a throwaway debug key every run, so each APK had a different signature and
    // Android refused to update over the previous one.
    //
    // The key itself is NOT in this repo any more. It lived here — with its
    // password in this file — in a PUBLIC repository, which meant anyone could
    // sign an APK that Android would accept as an in-place update to
    // com.toxicminds.recompos, on a package that ships its own APK installer.
    //
    // It now comes from, in order:
    //   1. ANDROID_KEYSTORE_FILE / ANDROID_KEYSTORE_PASSWORD env  (CI, from
    //      repository secrets — the workflow decodes ANDROID_KEYSTORE_B64)
    //   2. ~/.config/recompos/recompos.keystore                   (this machine)
    // With neither, the release/debug signingConfig is left unset and Gradle
    // falls back to its own debug key: a local build still works, and the ONLY
    // consequence is that its output cannot update a properly-signed install.
    // That is the right failure — a missing key must never silently produce an
    // APK signed by something else that looks legitimate.
    def ksPath = System.getenv('ANDROID_KEYSTORE_FILE')
        ?: "${System.getProperty('user.home')}/.config/recompos/recompos.keystore"
    def ksFile = file(ksPath)
    def ksPass = System.getenv('ANDROID_KEYSTORE_PASSWORD')
    def ksAlias = System.getenv('ANDROID_KEY_ALIAS') ?: 'recompos'
    def haveKeystore = ksFile.exists() && ksPass != null && !ksPass.isEmpty()

    if (!haveKeystore) {
        logger.warn("RecompOS: no signing keystore at ${ksPath} — this build CANNOT update an installed app.")
    }

    signingConfigs {
        stable {
            if (haveKeystore) {
                storeFile ksFile
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksPass
                storeType 'PKCS12'
            }
        }
    }
    // Two ways out of one app (2026-10-30):
    //   sideload  the APK on our GitHub release, which updates itself in place
    //             (ApkInstallerPlugin) and loads svelte-recomp.vercel.app, where
    //             every install so far keeps its data. Unchanged.
    //   play      the Google Play build: no self-update and no installing
    //             packages (Play's policy), no restricted exact-alarm permission
    //             (src/play/AndroidManifest.xml), and it loads slimchance.app, the
    //             address it keeps wherever the site is hosted.
    flavorDimensions 'store'
    productFlavors {
        sideload { dimension 'store' }
        // On Google Play the app is app.slimchance (2026-10-31): the package
        // name is in every Play link and fixed at the first upload, so it
        // carries the brand rather than a handle and the old name. The
        // direct download keeps com.toxicminds.recompos: installed apps
        // update in place only under the id they already have.
        play { dimension 'store'; applicationId 'app.slimchance' }
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug {
            // Only claim the stable config when the key is actually present;
            // otherwise leave Gradle's own debug signing in place (see above).
            if (haveKeystore) signingConfig signingConfigs.stable
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (haveKeystore) signingConfig signingConfigs.stable
        }
    }
}

// The Play build loads slimchance.app: the address in the synced
// capacitor.config.json is swapped as its assets are merged, so the config
// itself stays one file.
android.applicationVariants.configureEach { variant ->
    if (variant.flavorName == 'play') {
        variant.mergeAssetsProvider.configure { task ->
            task.doLast {
                def cfg = new File(task.outputDir.get().asFile, 'capacitor.config.json')
                if (!cfg.exists()) throw new GradleException('play: no capacitor.config.json in the merged assets; run cap sync first')
                def text = cfg.text.replace('"https://svelte-recomp.vercel.app"', '"https://slimchance.app"')
                if (!text.contains('"https://slimchance.app"')) throw new GradleException('play: the server address was not swapped')
                cfg.text = text
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
