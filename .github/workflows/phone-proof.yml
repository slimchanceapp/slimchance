name: Phone proof

# Proves both phones before anything is bought; no Apple or Google developer
# account is needed. Two jobs, side by side:
#
#   iphone   on Apple's simulator (macOS runner):
#              web     the live site in Safari's engine at iPhone size, as a
#                      stranger: start, finish setup, weigh-in shown on Today,
#                      every tab, no page errors; the trial deletes itself;
#              safari  the live site in the simulator's own Safari;
#              app     the iPhone app built unsigned, launched with its web
#                      console captured, then e2e/first-run.yaml.
#   android  on an Android 14 emulator: the APK people have now (the
#            release), then the same e2e/first-run.yaml, with its console.
#
# Screenshots, consoles and logs are the artifacts "iphone-proof" and
# "android-proof".

on:
  push:
    branches: [main]
    paths:
      - "svelte-recomp/ios/**"
      - "svelte-recomp/capacitor.config.json"
      - "svelte-recomp/e2e/**"
      - "svelte-recomp/scripts/iphone-proof.mjs"
      - ".github/workflows/phone-proof.yml"
  workflow_dispatch:
    inputs:
      apk_run:
        description: "Test an older Android build: the id of the build run whose moderly-apks to install (empty: the current release)"
        required: false
        default: ""
      chrome_site:
        description: "Instead of the app, run the first minute in Chrome at this address (e.g. a preview deployment)"
        required: false
        default: ""
      chrome_gpu:
        description: "With chrome_site: make Chrome draw with the emulator's GPU, as the app's WebView does (yes/no)"
        required: false
        default: "no"
  # Every night against the live site, so a break in either shell's first
  # minute shows up the next morning, not at the next native change.
  schedule:
    - cron: "20 2 * * *"

permissions:
  contents: read
  actions: read

jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: svelte-recomp
    env:
      # Public, non-secret values, as in the Android build.
      PUBLIC_SUPABASE_URL: https://jerbhsasccvjelkkphgu.supabase.co
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_H8G1aDyFJFLmgxrTc8qKeA_kxyXRLyk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install, build the web bundle, sync the iPhone project
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Boot an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import sys, json; d = json.load(sys.stdin)["devices"]; c = [x for k, v in sorted(d.items()) if "iOS" in k for x in v if x["name"].startswith("iPhone") and "SE" not in x["name"]]; print(c[-1]["udid"])')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          mkdir -p proof
          xcrun simctl list devices | grep "$UDID" | tee proof/device.txt
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: "web: the first run as a stranger, Safari's engine at iPhone size"
        run: |
          npm i --no-save playwright@1.55.0
          npx playwright install webkit
          node scripts/iphone-proof.mjs proof

      # A picture for the record, not a gate: the web step above already ran the
      # whole first run in Safari's engine, and the simulator's own Safari has
      # timed out on openurl (POSIX 60) once.
      - name: "safari: the live site in the simulator's Safari"
        continue-on-error: true
        run: |
          for try in 1 2; do
            xcrun simctl openurl "${{ steps.sim.outputs.udid }}" https://moderly.vercel.app/ && break
            sleep 10
          done
          sleep 25
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot proof/safari.png

      - name: "app: build the iPhone app for the simulator"
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build-ios CODE_SIGNING_ALLOWED=NO build > proof/xcodebuild.txt 2>&1 \
            || { tail -40 proof/xcodebuild.txt; exit 1; }
          tail -3 proof/xcodebuild.txt

      - name: "app: launch with its web console, screenshot"
        run: |
          U="${{ steps.sim.outputs.udid }}"
          xcrun simctl install "$U" build-ios/Build/Products/Debug-iphonesimulator/App.app
          # Capacitor prints the page's console to the app's stdout.
          xcrun simctl launch --console-pty "$U" com.toxicminds.recompos > proof/app-console.txt 2>&1 &
          sleep 35
          xcrun simctl io "$U" screenshot proof/app.png
          xcrun simctl terminate "$U" com.toxicminds.recompos || true
          echo "The app's web console:"
          cat proof/app-console.txt | tail -60

      - name: "app: the first-run flow"
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          export PATH="$HOME/.maestro/bin:$PATH"
          status=0
          maestro --device "${{ steps.sim.outputs.udid }}" test e2e/first-run.yaml || status=$?
          # The flow's own screenshots live with its debug files; keep them either way.
          cp -r "$HOME/.maestro/tests" proof/maestro-debug || true
          if [ "$status" -ne 0 ]; then
            xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot proof/flow-failed.png
            exit "$status"
          fi

      - name: Keep the proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-proof
          path: svelte-recomp/proof

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: The APK people have now, and Maestro
        env:
          GH_TOKEN: ${{ github.token }}
          APK_RUN: ${{ github.event.inputs.apk_run }}
        run: |
          if [ -n "$APK_RUN" ]; then
            gh run download "$APK_RUN" -R "$GITHUB_REPOSITORY" -n moderly-apks -D older && mv older/moderly.apk moderly.apk
          else
            curl -fsSL -o moderly.apk https://github.com/slimchanceapp/slimchance/releases/download/recompos-app-latest/recompos.apk
          fi
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          mkdir -p svelte-recomp/proof
          cat > android-proof.sh <<'EOF'
          set -e
          adb install moderly.apk
          adb logcat -c
          cd svelte-recomp
          # The whole log, streamed to a file as it happens: since build 25
          # (12 Nov) the emulator itself dies right after "Start now", and
          # the log read after the flow was empty because the device was gone.
          adb logcat -v time > proof/logcat-live.txt 2>&1 &
          # A stalled phone ends the flow in 10 minutes, not at the job's 40,
          # and nothing after it waits forever for a phone that's gone.
          if [ -n "$CHROME_SITE" ]; then
            if [ "$CHROME_GPU" = "yes" ]; then
              adb root && sleep 3
              adb shell 'echo "_ --enable-gpu-rasterization --ignore-gpu-blocklist" > /data/local/chrome-command-line && chmod 644 /data/local/chrome-command-line'
            fi
            timeout 600 maestro test -e SITE="$CHROME_SITE" e2e/first-run-chrome.yaml || status=$?
          else
            timeout 600 maestro test e2e/first-run.yaml || status=$?
          fi
          timeout 30 adb exec-out screencap -p > proof/android-screen.png || true
          timeout 30 adb shell uiautomator dump /sdcard/ui.xml > /dev/null && timeout 30 adb pull /sdcard/ui.xml proof/android-ui.xml || true
          cp -r "$HOME/.maestro/tests" proof/maestro-debug || true
          timeout 30 adb logcat -d -s Capacitor/Console Capacitor > proof/android-console.txt || true
          echo "The app's web console:"; tail -60 proof/android-console.txt
          exit ${status:-0}
          EOF

      - name: The first-run flow on an emulator (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CHROME_SITE: ${{ github.event.inputs.chrome_site }}
          CHROME_GPU: ${{ github.event.inputs.chrome_gpu }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          # Since 12 Nov the phone stalled at "Starting…": 2.5 GB with 71 MB
          # free, half a gigabyte swapped and both CPUs full, mostly Google's
          # services busy after boot (top, every 2 s, 13 Nov). Room for both.
          ram-size: 4096M
          cores: 4
          script: sh android-proof.sh

      - name: Keep the proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-proof
          path: svelte-recomp/proof
