name: Build Slim Chance APK

# Builds the native Slim Chance Android app: a thin Capacitor shell that loads the
# live web app from Vercel (so UI/logic updates arrive over the air with no
# reinstall) and adds native plugins (Health Connect, the moments). Reinstall
# only when NATIVE bits change; everyday updates come straight from Vercel.
#
# Three jobs, in order, and the release moves only if all pass:
#   build    signs with the old key AND the new one (APK Signature Scheme v3
#            key rotation), because the old key leaked into this public repo's
#            history;
#   update   proves on an Android emulator that the release people have now
#            updates in place to this build with its data kept, and that an
#            APK signed with the old key alone is refused afterwards;
#   publish  replaces the "recompos-app-latest" release asset.

on:
  push:
    branches: [main]
    paths:
      - "svelte-recomp/capacitor.config.json"
      - "svelte-recomp/android/**"
      - ".github/workflows/build-app-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: svelte-recomp
    env:
      # Public, non-secret values (URL + publishable key). Only used so the
      # offline-fallback bundle builds; the real app is served from Vercel.
      PUBLIC_SUPABASE_URL: https://jerbhsasccvjelkkphgu.supabase.co
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_H8G1aDyFJFLmgxrTc8qKeA_kxyXRLyk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default list starts with "tools", a package Google has
          # since removed from the SDK repository, and sdkmanager fails on it
          # before the build starts. build-tools gives apksigner.
          packages: platform-tools build-tools;35.0.0

      - name: Install JS dependencies
        run: npm ci

      - name: Build static web bundle (Capacitor target)
        run: BUILD_TARGET=capacitor npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      # Both keys live only in repository secrets and are written outside the
      # workspace, so an artifact upload or a stray `git add` can't pick them up.
      - name: Restore signing keystores
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_NEW_KEYSTORE_B64: ${{ secrets.ANDROID_NEW_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ] || [ -z "$ANDROID_NEW_KEYSTORE_B64" ]; then
            echo "::error::A signing keystore secret is missing; the APK could not update an installed app."
            exit 1
          fi
          mkdir -p "$HOME/.recompos"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$HOME/.recompos/recompos.keystore"
          printf '%s' "$ANDROID_NEW_KEYSTORE_B64" | base64 -d > "$HOME/.recompos/moderly.p12"
          chmod 600 "$HOME/.recompos/"*

      - name: Build debug APK (signed with the old key)
        working-directory: svelte-recomp/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x ./gradlew
          export ANDROID_KEYSTORE_FILE="$HOME/.recompos/recompos.keystore"
          ./gradlew assembleSideloadDebug --no-daemon --stacktrace

      # The old key is public, so the platform must stop accepting it: the new
      # key becomes the app's signer through a signed lineage (old -> new), and
      # the old key has no "rollback" right, so once a phone has this build an APK
      # signed with the old key alone can't update it. v1/v2 stay signed with
      # the old key for Android < 9, which can't follow a rotation.
      - name: Rotate the signing key
        env:
          OLD_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OLD_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NEW_PASS: ${{ secrets.ANDROID_NEW_KEYSTORE_PASSWORD }}
          NEW_ALIAS: ${{ secrets.ANDROID_NEW_KEY_ALIAS }}
        run: |
          set -euo pipefail
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          K="$HOME/.recompos"
          OLD=(--ks "$K/recompos.keystore" --ks-key-alias "$OLD_ALIAS" --ks-pass env:OLD_PASS)
          NEW=(--ks "$K/moderly.p12" --ks-key-alias "$NEW_ALIAS" --ks-pass env:NEW_PASS)
          "$SIGNER" rotate --out "$K/lineage.bin" --old-signer "${OLD[@]}" --new-signer "${NEW[@]}"
          # apksigner gives the old key no rollback capability by default (and
          # `lineage --set-rollback false` then has nothing to write); check it.
          "$SIGNER" lineage --in "$K/lineage.bin" --print-certs | tee lineage.txt
          grep -A6 "Signer #1 in lineage" lineage.txt | grep -q "Has rollback capability      : false"
          cp android/app/build/outputs/apk/sideload/debug/app-sideload-debug.apk old-key-only.apk
          "$SIGNER" sign --in android/app/build/outputs/apk/sideload/debug/app-sideload-debug.apk --out moderly.apk \
            "${OLD[@]}" --next-signer "${NEW[@]}" --lineage "$K/lineage.bin" --rotation-min-sdk-version 28
          "$SIGNER" verify --verbose --print-certs moderly.apk

      # The Google Play build (flavor "play", app/build.gradle): an app bundle
      # signed with the new key, which is the Play upload key (Google signs what
      # it ships). It loads slimchance.app and can't install packages; checked
      # here, kept as an artifact for the Play Console, never published.
      - name: Build the Google Play bundle
        working-directory: svelte-recomp/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_NEW_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_NEW_KEY_ALIAS }}
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_FILE="$HOME/.recompos/moderly.p12"
          ./gradlew bundlePlayRelease --no-daemon --stacktrace
          AAB=app/build/outputs/bundle/playRelease/app-play-release.aab
          unzip -p "$AAB" base/assets/capacitor.config.json | grep -q '"https://slimchance.app"'
          unzip -p "$AAB" base/manifest/AndroidManifest.xml | grep -aq 'app\.slimchance'
          ! unzip -p "$AAB" base/manifest/AndroidManifest.xml | grep -aq 'REQUEST_INSTALL_PACKAGES'
          ! unzip -p "$AAB" base/manifest/AndroidManifest.xml | grep -aq 'USE_EXACT_ALARM'
          cp "$AAB" ../slimchance-play.aab

      - name: Shred the keystores
        if: always()
        run: rm -rf "$HOME/.recompos"

      - name: Upload APKs for the update test
        uses: actions/upload-artifact@v4
        with:
          name: moderly-apks
          path: |
            svelte-recomp/moderly.apk
            svelte-recomp/old-key-only.apk
          if-no-files-found: error

      - name: Keep the Google Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: slimchance-play-aab
          path: svelte-recomp/slimchance-play.aab
          if-no-files-found: error
          retention-days: 90

  update:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download this build
        uses: actions/download-artifact@v4
        with:
          name: moderly-apks

      - name: Download the release people have now
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download recompos-app-latest -R "${{ github.repository }}" -p recompos.apk -O current.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write the update test
        run: |
          cat > update-test.sh <<'SH'
          set -eu
          PKG=com.toxicminds.recompos
          adb install current.apk
          # One string per adb shell: adb joins its arguments and the device's
          # shell re-splits them, so inner quotes must survive the trip.
          adb shell "run-as $PKG sh -c 'mkdir -p files && echo kept > files/update-marker'"
          adb shell "run-as $PKG cat files/update-marker"
          adb install -r moderly.apk
          adb shell "run-as $PKG cat files/update-marker" | grep -q kept
          echo "updated in place, data kept"
          if adb install -r old-key-only.apk; then
            echo "::error::An APK signed with the old key alone still updates the app."
            exit 1
          fi
          echo "old key refused"
          adb shell dumpsys package $PKG | grep -m1 versionCode
          SH

      - name: Update on an emulator (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: sh update-test.sh

  publish:
    needs: update
    runs-on: ubuntu-latest
    steps:
      - name: Download this build
        uses: actions/download-artifact@v4
        with:
          name: moderly-apks

      - name: Name it for the release
        run: cp moderly.apk recompos.apk

      - name: Publish to the release (stable download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: recompos-app-latest
          name: Slim Chance (Android app)
          body: |
            Slim Chance for Android. It loads the live app from its website,
            so updates arrive by themselves; reinstall only when this release
            changes, and the app offers that itself.

            Install once, start or sign in, and allow Health Connect if you want
            steps, sleep, workouts and a smart scale's weigh-ins.
          files: recompos.apk
          fail_on_unmatched_files: true
